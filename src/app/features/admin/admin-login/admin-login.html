<div class="admin-login-container">
    <div class="login-card">
        <div class="logo-area">
            <h2>STAY<span>BOOK</span></h2>
            <p>Hệ Thống Quản Trị Trung Tâm</p>
        </div>

        <div *ngIf="errorMessage" class="alert-error">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="form-group">
                <label>Email quản trị</label>
                <input type="email" name="email" [(ngModel)]="email" required placeholder="admin@gmail.com"
                    class="form-control">
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" [(ngModel)]="password" required placeholder="••••••••"
                    class="form-control">
            </div>

            <button type="submit" class="btn-login" [disabled]="!loginForm.valid || isLoading">
                <span *ngIf="!isLoading">Đăng nhập hệ thống</span>
                <span *ngIf="isLoading">Đang xác thực...</span>
            </button>
        </form>
    </div>
</div>
