<div class="fade-in-up" style="background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
  <h2 style="margin-top: 0; color: #1e1b4b; margin-bottom: 20px;">Hồ sơ Khách sạn</h2>

  <div *ngIf="message" style="background-color: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 20px;">
    {{ message }}
  </div>

  <form (ngSubmit)="saveProfile()">
    <div style="margin-bottom: 15px;">
      <label style="display:block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #334155;">Tên Khách sạn (*)</label>
      <input type="text" [(ngModel)]="profile.name" name="name" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
    </div>

    <div style="display: flex; gap: 15px; margin-bottom: 15px;">
      <div style="flex: 2;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #334155;">Địa chỉ (*)</label>
        <input type="text" [(ngModel)]="profile.address" name="address" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
      </div>
      <div style="flex: 1;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #334155;">Thành phố (*)</label>
        <input type="text" [(ngModel)]="profile.city" name="city" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
      </div>
      <div style="flex: 1;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #334155;">Hạng sao</label>
        <select [(ngModel)]="profile.star_rating" name="star_rating" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
          <option [value]="1">1 Sao</option>
          <option [value]="2">2 Sao</option>
          <option [value]="3">3 Sao</option>
          <option [value]="4">4 Sao</option>
          <option [value]="5">5 Sao</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom: 25px;">
      <label style="display:block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #334155;">Mô tả giới thiệu</label>
      <textarea [(ngModel)]="profile.description" name="description" rows="5" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;"></textarea>
    </div>

    <button type="submit" style="background: linear-gradient(90deg, #4f46e5 0%, #6366f1 100%); color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;">Lưu Thông Tin</button>
  </form>
</div>
