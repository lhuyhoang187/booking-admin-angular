<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8fafc;">
  <div style="background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px;">
    <h2 style="text-align: center; color: #4f46e5; margin-bottom: 30px; font-weight: 800; letter-spacing: 1px;">PARTNER PORTAL</h2>
    
    <form (ngSubmit)="onSubmit()">
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px;">Email / Tên đăng nhập</label>
        <input type="email" [(ngModel)]="email" name="email" required style="width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; outline: none; transition: all 0.3s;" onfocus="this.style.borderColor='#4f46e5'; this.style.boxShadow='0 0 0 3px rgba(79, 70, 229, 0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
      </div>

      <div style="margin-bottom: 30px;">
        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px;">Mật khẩu</label>
        <input type="password" [(ngModel)]="password" name="password" required style="width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; outline: none; transition: all 0.3s;" onfocus="this.style.borderColor='#4f46e5'; this.style.boxShadow='0 0 0 3px rgba(79, 70, 229, 0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
      </div>

      <button type="submit" [disabled]="isLoading" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);">
        {{ isLoading ? 'Đang xử lý...' : 'Đăng nhập ngay' }}
      </button>
    </form>

    <div style="text-align: center; margin-top: 25px; font-size: 14px; color: #64748b;">
      Chưa có tài khoản? <a routerLink="/register" style="color: #4f46e5; font-weight: 600; text-decoration: none;">Đăng ký mở bán phòng</a>
    </div>
  </div>
</div>
