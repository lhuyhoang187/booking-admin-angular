<div class="fade-in-up" style="background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
  <h2 style="margin-top: 0; color: #1e1b4b; margin-bottom: 5px;">Tổng quan hoạt động</h2>
  <p style="color: #64748b; margin-bottom: 30px;">Chào mừng bạn quay trở lại hệ thống quản lý Khách sạn!</p>

  <div style="display: flex; gap: 20px; flex-wrap: wrap;">
    <div style="flex: 1; min-width: 250px; background-color: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 12px; padding: 25px; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'">
      <h4 style="margin: 0 0 15px 0; color: #065f46; font-size: 16px;">Đơn hàng mới chờ duyệt</h4>
      <div style="font-size: 40px; font-weight: 800; color: #10b981;">{{ stats.new_bookings }}</div>
    </div>

    <div style="flex: 1; min-width: 250px; background-color: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 25px; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'">
      <h4 style="margin: 0 0 15px 0; color: #1e40af; font-size: 16px;">Tổng số loại phòng</h4>
      <div style="font-size: 40px; font-weight: 800; color: #3b82f6;">{{ stats.total_rooms }}</div>
    </div>

    <div style="flex: 1; min-width: 250px; background-color: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 25px; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'">
      <h4 style="margin: 0 0 15px 0; color: #92400e; font-size: 16px;">Tổng Doanh thu</h4>
      <div style="font-size: 40px; font-weight: 800; color: #f59e0b;">{{ stats.revenue | number }} đ</div>
    </div>
  </div>
</div>
