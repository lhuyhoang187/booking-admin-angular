<div class="dashboard-container">
  
  <div class="sidebar">
    <div class="brand">Partner Portal</div>
    
    <ul class="menu-list">
      <li>
        <a routerLink="/dashboard" routerLinkActive="active-menu" [routerLinkActiveOptions]="{exact: true}" class="menu-item">
          📊 Tổng quan
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/hotel" routerLinkActive="active-menu" class="menu-item">
          🏨 Hồ sơ Khách sạn
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/rooms" routerLinkActive="active-menu" class="menu-item">
          🛏️ Quản lý Loại phòng
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/bookings" routerLinkActive="active-menu" class="menu-item">
          📝 Quản lý Đơn hàng
        </a>
      </li>
    </ul>

    <button class="logout-btn" (click)="logout()">🚪 Đăng xuất</button>
  </div>

  <div class="main-content">
    <div class="fade-in-up">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>
